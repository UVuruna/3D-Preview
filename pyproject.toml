[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preview3d"
version = "0.0.1"
description = "Embeddable 3D previewer — Three.js core wrapped as a PySide6 widget"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[tool.hatch.build.targets.wheel]
packages = ["preview3d"]

# Ship the built web bundle inside the package so `pip install git+...` works
# without Node on the consumer's machine, and the shared spec both renderers
# read so a colour or a view preset cannot drift between them.
[tool.hatch.build.targets.wheel.force-include]
"web" = "preview3d/web"
"shared" = "preview3d/shared"
